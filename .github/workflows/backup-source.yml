name: Backup Source Snapshot

on:
  push:
    paths:
      - '.github/workflows/backup-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: zip -rq CATALOGO_DONATELLO_SOURCE_2026-09-10.zip . -x '.git/*' 'node_modules/*' 'dist/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: CATALOGO_DONATELLO_SOURCE_2026-09-10
          path: CATALOGO_DONATELLO_SOURCE_2026-09-10.zip
          retention-days: 30
