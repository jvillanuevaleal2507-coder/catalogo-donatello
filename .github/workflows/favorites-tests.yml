name: Donatello catalog XSS regression
on:
  pull_request:
    paths:
      - 'src/favorites.js'
      - 'tests/favorites.test.cjs'
      - '.github/workflows/favorites-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  favorites-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run favorites security regression tests
        run: node --test tests/favorites.test.cjs
